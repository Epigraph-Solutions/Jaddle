[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jaddle"
version = "0.3.1"
description = "First-order primal-dual solvers for large-scale linear and convex programs, written in JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Brendan van Rooyen" }]
requires-python = ">=3.11"
keywords = [
    "optimization",
    "linear programming",
    "convex optimization",
    "pdhg",
    "pdlp",
    "saddle point",
    "jax",
    "gpu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Floors are the versions Jaddle is developed and tested against.
dependencies = [
    "jax>=0.10",
    "optax>=0.2.8",
    "numpy>=2.0",
    "scipy>=1.13",
    "highspy>=1.14",
    # jax.export needs it to serialize functions (save_solver, save_cp), but
    # jax does not install it.
    "flatbuffers>=24",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10"]
cuda13 = ["jax[cuda13]>=0.10"]
examples = ["matplotlib>=3.8", "scikit-learn>=1.5"]
rag_examples = ["jaddle[examples]", "fastembed>=0.9", "snowballstemmer>=2.2"]
benchmarks = ["mpax>=0.1"]
cvxpy = ["cvxpy>=1.6"]
# The incremental feasibility jump (jaddle._jump_numba), much faster than the
# device one on the root heuristics, compiled bound propagation
# (jaddle._propagate_numba), cut separation (jaddle._separate_numba) and
# Lagrangian bounds (jaddle._bound_numba).
fast = ["numba>=0.61"]
# Symmetry detection in jm.solve (symmetry_generators): igraph bundles bliss.
symmetry = ["igraph>=0.11"]
test = ["pytest>=8", "cvxpy>=1.6", "numba>=0.61", "igraph>=0.11"]
dev = ["jaddle[examples,test]", "build", "twine"]

[project.urls]
Homepage = "https://github.com/BrendanVR/Jaddle"
Source = "https://github.com/BrendanVR/Jaddle"
Issues = "https://github.com/BrendanVR/Jaddle/issues"
Changelog = "https://github.com/BrendanVR/Jaddle/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["jaddle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
